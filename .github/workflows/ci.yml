name: Java CI Clean Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          submodules: recursive  # ← NEU: Löst dein Problem

      - name: Java 22 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/transfermarkt-analyst/pom.xml'

      - name: Java-Code kompilieren und testen
        working-directory: backend/transfermarkt-analyst
        run: mvn -B clean test -Dspring-boot.repackage.skip=true

      - name: JaCoCo Coverage-Report hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/transfermarkt-analyst/target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn
